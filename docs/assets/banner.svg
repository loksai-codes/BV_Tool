<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Power BI Visual Data Comparator</title>
  <desc id="d">Animated banner: original and migrated report bars grow, one difference is highlighted, status chips appear.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16325c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 40px; font-weight: 700; fill: #ffffff; }
      .sub   { font-size: 17px; fill: #b7c6dd; }
      .lbl   { font-size: 13px; fill: #8fa3c0; letter-spacing: .5px; }
      .bar   { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 6s ease-out infinite; }
      .o { fill: #3987e5; } .m { fill: #86b6ef; }
      .diff  { fill: #e34948; }
      .b1{animation-delay:.05s}.b2{animation-delay:.15s}.b3{animation-delay:.25s}.b4{animation-delay:.35s}.b5{animation-delay:.45s}.b6{animation-delay:.55s}
      @keyframes grow { 0%{transform:scaleY(0)} 18%{transform:scaleY(1)} 92%{transform:scaleY(1);opacity:1} 100%{transform:scaleY(1);opacity:0} }
      .ring  { fill: none; stroke: #e34948; stroke-width: 2.5; transform-box: fill-box; transform-origin: center; animation: ring 6s ease-out infinite; opacity: 0; }
      @keyframes ring { 0%,30%{opacity:0;transform:scale(.6)} 38%{opacity:1;transform:scale(1)} 50%{opacity:.25;transform:scale(1.25)} 62%{opacity:1;transform:scale(1)} 90%{opacity:1} 100%{opacity:0} }
      .tag   { opacity: 0; animation: fade 6s ease-out infinite; animation-delay: 0s; }
      @keyframes fade { 0%,34%{opacity:0;transform:translateY(6px)} 42%{opacity:1;transform:translateY(0)} 92%{opacity:1} 100%{opacity:0} }
      .chip  { opacity: 0; animation: chip 6s ease-out infinite; }
      .c1{animation-delay:.9s}.c2{animation-delay:1.1s}.c3{animation-delay:1.3s}.c4{animation-delay:1.5s}.c5{animation-delay:1.7s}.c6{animation-delay:1.9s}
      @keyframes chip { 0%{opacity:0;transform:translateY(8px)} 10%{opacity:1;transform:translateY(0)} 80%{opacity:1} 95%,100%{opacity:0} }
      .chip text { font-size: 12px; font-weight: 600; }
      .sweep { animation: sweep 6s linear infinite; }
      @keyframes sweep { from{transform:translateX(-400px)} to{transform:translateX(1400px)} }
      .arrow { stroke: #8fa3c0; stroke-width: 2; fill: none; stroke-dasharray: 6 6; animation: dash 1.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -12; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect class="sweep" x="0" y="0" width="260" height="320" fill="url(#shine)"/>
  </g>

  <text class="title" x="48" y="92">Power BI Visual Data Comparator</text>
  <text class="sub" x="48" y="126">Reconciles the data your report visuals actually export —</text>
  <text class="sub" x="48" y="150">Original report (China context) ⇄ Migrated report · read-only · evidence for every finding</text>

  <!-- status chips -->
  <g transform="translate(48,196)">
    <g class="chip c1"><rect width="74" height="28" rx="14" fill="#0ca30c"/><text x="37" y="18.5" text-anchor="middle" fill="#ffffff">PASS</text></g>
    <g transform="translate(84,0)"><g class="chip c2"><rect width="70" height="28" rx="14" fill="#d03b3b"/><text x="35" y="18.5" text-anchor="middle" fill="#ffffff">FAIL</text></g></g>
    <g transform="translate(164,0)"><g class="chip c3"><rect width="88" height="28" rx="14" fill="#fab219"/><text x="44" y="18.5" text-anchor="middle" fill="#0b0b0b">PARTIAL</text></g></g>
    <g transform="translate(262,0)"><g class="chip c4"><rect width="124" height="28" rx="14" fill="#fab219"/><text x="62" y="18.5" text-anchor="middle" fill="#0b0b0b">INCONCLUSIVE</text></g></g>
    <g transform="translate(396,0)"><g class="chip c5"><rect width="122" height="28" rx="14" fill="#898781"/><text x="61" y="18.5" text-anchor="middle" fill="#ffffff">UNSUPPORTED</text></g></g>
    <g transform="translate(528,0)"><g class="chip c6"><rect width="112" height="28" rx="14" fill="#c3c2b7"/><text x="56" y="18.5" text-anchor="middle" fill="#0b0b0b">NOT MAPPED</text></g></g>
  </g>
  <text class="lbl" x="48" y="262">Power BI REST · JavaScript SDK exportData() · Playwright · Python · Streamlit</text>

  <!-- mini charts -->
  <g transform="translate(770,70)">
    <text class="lbl" x="0" y="0">ORIGINAL · China</text>
    <line x1="0" y1="170" x2="160" y2="170" stroke="#3a4f6e"/>
    <rect class="bar o b1" x="6"   y="80"  width="18" height="90"/>
    <rect class="bar o b2" x="32"  y="50"  width="18" height="120"/>
    <rect class="bar o b3" x="58"  y="96"  width="18" height="74"/>
    <rect class="bar o b4" x="84"  y="64"  width="18" height="106"/>
    <rect class="bar o b5" x="110" y="40"  width="18" height="130"/>
    <rect class="bar o b6" x="136" y="88"  width="18" height="82"/>

    <path class="arrow" d="M172 110 H 214"/>
    <path d="M208 104 L216 110 L208 116" fill="none" stroke="#8fa3c0" stroke-width="2"/>

    <g transform="translate(232,0)">
      <text class="lbl" x="0" y="0">MIGRATED</text>
      <line x1="0" y1="170" x2="160" y2="170" stroke="#3a4f6e"/>
      <rect class="bar m b1" x="6"   y="80"  width="18" height="90"/>
      <rect class="bar m b2" x="32"  y="50"  width="18" height="120"/>
      <rect class="bar diff b3" x="58" y="70" width="18" height="100"/>
      <rect class="bar m b4" x="84"  y="64"  width="18" height="106"/>
      <rect class="bar m b5" x="110" y="40"  width="18" height="130"/>
      <rect class="bar m b6" x="136" y="88"  width="18" height="82"/>
      <rect class="ring" x="50" y="62" width="34" height="116" rx="8"/>
      <g class="tag">
        <rect x="-24" y="186" width="208" height="30" rx="8" fill="#2a1418" stroke="#e34948"/>
        <text x="80" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#ffb4b4">Δ +1,500.00 · VALUE MISMATCH</text>
      </g>
    </g>
  </g>
</svg>
